version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: lego-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: lego_builder
    volumes:
      - ./data:/data/db
      - ./data/configdb:/data/configdb
    networks:
      - lego-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Data Pipeline
  python:
    build:
      context: ./python-data
      dockerfile: Dockerfile
    container_name: lego-python
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/lego_builder
      PYTHONUNBUFFERED: 1
    volumes:
      - ./python-data:/app
    networks:
      - lego-network
    command: tail -f /dev/null  # Keep container running; we'll run scripts manually

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lego-backend
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/lego_builder
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src  # Hot reload for src changes
      - ./backend/node_modules:/app/node_modules
    networks:
      - lego-network
    command: npm run dev  # Uses nodemon for hot reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lego-frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
      VITE_API_URL: http://localhost:5000  # If using Vite
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src  # Hot reload
      - ./frontend/node_modules:/app/node_modules
    networks:
      - lego-network
    command: npm run dev

networks:
  lego-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_configdb:
